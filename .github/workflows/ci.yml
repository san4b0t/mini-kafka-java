name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java 17 tests and concurrency metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and run all tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Add concurrency metrics to job summary
        if: ${{ always() && hashFiles('target/metrics/append-only-log-load.txt') != '' }}
        run: |
          echo '## Concurrency metrics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat target/metrics/append-only-log-load.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/metrics/
          if-no-files-found: warn
          retention-days: 14
